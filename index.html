<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>דוח מיפוי גרמושקה</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&family=Secular+One&display=swap">
<style>
:root{--night:#0d1b2a;--panel:#13263a;--amber:#ffb547;--amber-soft:#ffe0a8;--paper:#f7f5ef;--ink:#172334;--bad:#ffb4b4;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse at 80% 0%,#ff8a5b22,transparent 55%),var(--night);color:var(--paper);
  font-family:Assistant,system-ui,"Segoe UI",Arial,sans-serif;display:grid;place-items:center;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.card{width:min(420px,100%);background:var(--panel);border:1px solid #ffb54733;border-radius:14px;padding:28px 24px;display:grid;gap:14px}
h1{font-family:"Secular One",Assistant,sans-serif;font-weight:400;font-size:1.9rem;line-height:1.1;margin:0;color:var(--amber-soft)}
p{margin:0;color:#c9d3de}
label{font-weight:700}
input{font:inherit;font-size:1.05rem;padding:10px 12px;border-radius:8px;border:1px solid #ffb54766;background:var(--night);color:var(--paper);width:100%;direction:ltr;text-align:left}
button{font:inherit;font-weight:700;font-size:1.05rem;background:var(--amber);color:var(--ink);border:0;border-radius:8px;padding:10px;cursor:pointer;min-height:44px}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.msg{min-height:1.4em;font-size:.95rem}
.msg.err{color:var(--bad)}
small{color:#8a9bb0}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <h1>דוח מיפוי גרמושקה</h1>
  <p>הדוח מוצפן. הקלידו את הסיסמה כדי לפתוח אותו.</p>
  <label for="pw">סיסמה</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
  <button id="go" type="submit">פתיחת הדוח</button>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <small>הפענוח נעשה בדפדפן שלכם בלבד. הסיסמה לא נשלחת לשום שרת.</small>
</form>
<noscript><p style="text-align:center">צריך JavaScript כדי לפתוח את הדוח.</p></noscript>
<script>
const ITER = 600000;
const f = document.getElementById("f"), pw = document.getElementById("pw"), go = document.getElementById("go"), msg = document.getElementById("msg");
let blob = null;
function loadScript(src){ return new Promise((ok,bad) => { const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>bad(new Error("lib")); document.head.appendChild(s); }); }
async function gunzip(buf){
  if (window.DecompressionStream) {
    try { return await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text(); } catch (e) {}
  }
  if (!window.pako) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js");
  return pako.ungzip(new Uint8Array(buf), {to:"string"});
}
async function vault(){ if (!blob){ const r = await fetch("vault/report.bin", {cache:"no-cache"}); if(!r.ok) throw new Error("load"); blob = new Uint8Array(await r.arrayBuffer()); } return blob; }
f.addEventListener("submit", async e => {
  e.preventDefault();
  go.disabled = true; msg.className = "msg"; msg.textContent = "מפענח…";
  try {
    const b = await vault();
    const salt = b.slice(0,16), iv = b.slice(16,28), ct = b.slice(28);
    if (!(window.crypto && crypto.subtle)) throw new Error("crypto");
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw.value.trim()), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:ITER, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    let plain;
    try { plain = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, ct); }
    catch { throw new Error("pw"); }
    const html = await gunzip(plain);
    document.open(); document.write(html); document.close();
  } catch (err) {
    go.disabled = false; msg.className = "msg err";
    msg.textContent = {pw:"הסיסמה שגויה. שימו לב לאותיות קטנות באנגלית ונסו שוב.",
      crypto:"הדפדפן הזה לא תומך בפענוח. פתחו את הקישור ב-Chrome, Edge, Firefox או Safari מעודכן (לא מתוך וואטסאפ או פייסבוק).",
      lib:"לא הצלחתי לטעון רכיב פענוח. בדקו את החיבור לאינטרנט ונסו שוב.",
      load:"לא הצלחתי להוריד את הדוח. ייתכן שסינון אינטרנט (כמו נטפרי) חוסם את github.io. בדקו את החיבור ונסו שוב."}[err.message]
      || ("לא הצלחתי לפתוח את הדוח: " + err.message);
    pw.select();
  }
});
</script>
</body>
</html>
